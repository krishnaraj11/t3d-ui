<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-xl border border-gray-700 p-8">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-white tracking-tight">Create an Account</h2>
      <p class="text-gray-400 mt-2">Join the T3D Models community.</p>
    </div>

    <div *ngIf="errorMessage" class="bg-red-900/50 border border-red-500 text-red-200 px-4 py-3 rounded-lg mb-6 text-sm text-center">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Username</label>
        <input type="text" [(ngModel)]="username" name="username" required
          class="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-blue-500 transition-colors">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" required
          class="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-blue-500 transition-colors">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
        <div class="relative">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required
            class="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 pl-4 pr-12 text-white focus:outline-none focus:border-blue-500 transition-colors">
            
          <button type="button" (click)="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-blue-400 focus:outline-none transition-colors">
            
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>

            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
            
          </button>
        </div>
      </div>

      <button type="submit" [disabled]="isLoading"
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 mt-4">
        {{ isLoading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>
    
    <p class="mt-6 text-center text-sm text-gray-400">
      Already have an account? 
      <a routerLink="/login" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">Log in here</a>
    </p>
  </div>
</div>
