<div class="max-w-3xl mx-auto px-4 py-12">
  <div class="bg-gray-800 rounded-2xl shadow-xl border border-gray-700 p-8">
    
    <h2 class="text-3xl font-bold text-white mb-8 border-b border-gray-700 pb-4">Upload New 3D Model</h2>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- Title -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Model Title <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="title" name="title" required
          class="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" 
          placeholder="e.g., Sci-Fi Hover Bike">
      </div>

      <!-- Price & PolyCount Row -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Price ($)</label>
          <input type="number" [(ngModel)]="price" name="price" step="0.01"
            class="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Poly Count</label>
          <input type="number" [(ngModel)]="polyCount" name="polyCount"
            class="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
        </div>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Description</label>
        <textarea [(ngModel)]="description" name="description" rows="4"
          class="w-full bg-gray-900 border border-gray-600 rounded-lg py-3 px-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" 
          placeholder="Describe your model..."></textarea>
      </div>

      <!-- File Upload Box -->
      <div class="pt-4">
        <label class="block text-sm font-medium text-gray-300 mb-2">3D File (.glb, .fbx, .obj) <span class="text-red-500">*</span></label>
        <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-600 border-dashed rounded-lg hover:border-blue-500 transition-colors bg-gray-900/50">
          <div class="space-y-1 text-center">
            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
              <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="flex text-sm text-gray-400 justify-center">
              <label class="relative cursor-pointer bg-transparent rounded-md font-medium text-blue-500 hover:text-blue-400 focus-within:outline-none">
                <span>Upload a file</span>
                <input type="file" class="sr-only" (change)="onFileSelected($event)" accept=".glb,.gltf,.fbx,.obj,.txt">
              </label>
            </div>
            <p class="text-xs text-gray-500">Max size 50MB</p>
            <p *ngIf="selectedFile" class="text-sm text-green-400 font-bold mt-2">Selected: {{ selectedFile.name }}</p>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="pt-6">
        <button type="submit" [disabled]="isSubmitting"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-gray-800 disabled:opacity-50 transition-colors">
          {{ isSubmitting ? 'Uploading to Server...' : 'Publish Model' }}
        </button>
      </div>

    </form>
  </div>
</div>
