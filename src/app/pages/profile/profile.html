<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-lg mb-10">
        <div class="h-32 bg-gradient-to-r from-blue-600 to-purple-600"></div>
        <div class="px-8 pb-8 relative">
            <div class="w-24 h-24 bg-slate-900 border-4 border-slate-800 rounded-full flex items-center justify-center text-4xl text-white font-bold shadow-md absolute -top-12 overflow-hidden">
    <img *ngIf="userProfile?.profileImageUrl" 
         [src]="'http://localhost:8080' + userProfile.profileImageUrl" 
         class="w-full h-full object-cover">

    <span *ngIf="!userProfile?.profileImageUrl">
        {{ portfolioUsername ? (portfolioUsername.charAt(0) | uppercase) : 'U' }}
    </span>
</div>

<div class="pt-16">
    <h1 class="text-3xl font-bold text-white">{{ portfolioUsername }}</h1>
    <p class="text-slate-400 mt-1">{{ userProfile?.bio || 'Creator & 3D Artist' }}</p>
</div>
        </div>
    </div>

    <h2 class="text-2xl font-bold text-white mb-6">Portfolio</h2>

    <div *ngIf="isLoading" class="text-blue-400 bg-slate-800 p-8 rounded-lg text-center border border-slate-700 animate-pulse font-semibold">
        Loading portfolio...
    </div>

    <div *ngIf="!isLoading && userModels.length === 0" class="text-slate-400 bg-slate-800 p-8 rounded-lg text-center border border-slate-700">
        This creator hasn't published any models yet.
    </div>

    <div *ngIf="!isLoading && userModels.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        <div *ngFor="let model of userModels" class="bg-gray-800 rounded-xl overflow-hidden shadow-lg border border-gray-700 hover:border-blue-500 hover:shadow-blue-900/20 transition-all duration-300 group cursor-pointer flex flex-col">
            
            <div class="relative h-56 w-full bg-gray-900">
                <model-viewer 
                    [src]="model.modelFileUrl ? 'http://localhost:8080' + model.modelFileUrl : ''" 
                    alt="3D model thumbnail"
                    shadow-intensity="1"
                    interaction-prompt="none"
                    class="w-full h-full block rounded-t-lg"
                    style="background-color: white; pointer-events: none; outline: none;">
                </model-viewer>
                <div class="absolute top-3 right-3 bg-blue-600/90 backdrop-blur-sm text-white text-sm font-bold px-3 py-1 rounded-full shadow-md">
                    ₹{{ model.price }}
                </div>
            </div>

            <div class="p-5 flex flex-col flex-grow">
                <h3 class="text-lg font-bold text-gray-100 truncate">{{ model.title }}</h3>
                <div class="flex-grow"></div>
                <div class="flex justify-between items-center mt-5 pt-4 border-t border-gray-700">
                    <div class="text-gray-400 text-xs font-medium"><span class="text-gray-500 mr-1">▲</span>{{ model.polyCount }} polys</div>
                    <button [routerLink]="['/model', model.id]" class="text-sm bg-gray-700 group-hover:bg-blue-600 text-white font-semibold py-1.5 px-4 rounded transition-colors duration-300">View</button>
                </div>
            </div>

        </div>
    </div>
</div>
