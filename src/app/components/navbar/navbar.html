<nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">

    <div class="flex justify-between items-center h-16">
      
      <div class="flex items-center">
        <a routerLink="/" class="text-2xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 cursor-pointer">

      </div>

          <input type="text" (input)="onSearch($event)" class="w-full bg-gray-800 border border-gray-700 text-gray-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block pl-4 p-2.5 outline-none transition-colors" placeholder="Search 3D models...">

      </div>
